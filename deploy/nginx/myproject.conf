# One domain, one server. Install as /etc/nginx/sites-available/myproject,
# symlink into sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Nginx serves the front end, the uploads and the static files itself, and
# hands /api/ and /admin/ to gunicorn.
#
# The certificate must exist before this file is enabled (nginx -t fails
# without it), so obtain it while the default site is still on:
#   sudo certbot certonly --nginx -d example.com -d www.example.com
#
# Requires /etc/nginx/snippets/myproject-security-headers.conf, from
# security-headers.conf beside this file.

upstream myproject_api {
    server 127.0.0.1:8001;
}

# Rate limiting that does not depend on Redis.
#
# Django's throttles keep their counters in the cache, so a Redis outage
# takes them with it (IGNORE_EXCEPTIONS keeps the site serving). This layer
# stands in that gap, and rejects a flood before it costs a gunicorn worker.
#
# Two zones: `api` is generous because the front end polls, `login` is tight
# and covers every endpoint where guessing pays or mail is sent. 10m of
# shared memory holds roughly 160,000 addresses.
#
# ⚠ Behind a CDN, $binary_remote_addr is the CDN's address, so every visitor
# shares one counter — uncomment the real_ip block below. Do NOT raise
# NUM_PROXIES in Django instead: Nginx overwrites X-Forwarded-For with
# $remote_addr, so a higher count reads an entry that is not there.
#
# real_ip_header CF-Connecting-IP;
# set_real_ip_from 173.245.48.0/20;   # the current list is published at
# set_real_ip_from 103.21.244.0/22;   # https://www.cloudflare.com/ips/
# ... one line per published range ...
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

# 429, matching DRF. Nginx's default 503 reads as "the server is broken".
limit_req_status 429;

# Plain HTTP, either name: straight to HTTPS on the canonical name.
server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

# www over HTTPS: one canonical address, so a link is never two pages and a
# cookie is never set on the wrong host.
server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No version in the Server header: it tells a scanner what to try.
    server_tokens off;

    # The built front end. For an API-only project delete `root`/`index` and
    # the last three location blocks.
    root /srv/myproject/app/frontend/dist;
    index index.html;

    # The API caps uploads at 10 MB; this leaves room for form overhead.
    # Nginx's own default of 1 MB rejects a phone photograph.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Built files are named by content hash, so a new build has new names and
    # nothing stale is ever served.
    location /assets/ {
        include snippets/myproject-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /static/ {
        include snippets/myproject-security-headers.conf;
        alias /srv/myproject/app/backend/staticfiles/;
        expires 30d;
    }

    # `nosniff` in the snippet stops a browser rendering an uploaded "image"
    # as HTML on our domain. X-Robots-Tag has to be here, not in Django's
    # middleware: Nginx serves this folder off the disk and the requests
    # never reach Python — without it every avatar is indexable in image
    # search, which undoes HIDE_USERS and the search minimum.
    location /media/ {
        include snippets/myproject-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /srv/myproject/media/;
        expires 30d;
    }

    # Sign-in, signup, password reset, resend-activation, change-email,
    # set-password and Google: every endpoint where guessing pays or mail is
    # sent. Spelled out, because a shorter pattern once covered only
    # `jwt/create` and left the mail-sending paths on the 30r/s budget.
    #
    # Must come before the general block below: for regex locations Nginx
    # takes the FIRST match, not the longest.
    location ~ ^/api/v[0-9]+/(google|auth/jwt/create|auth/users(/(reset_password|resend_activation|change-email|set_password|set-new-password|activation))?)/?$ {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://myproject_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Everything Django owns.
    #
    # ⚠ CHANGE `admin` BELOW to match ADMIN_URL in .env. Move the admin
    # without editing this line and the new path never reaches Django: it
    # falls through to the SPA block and answers 200 with index.html.
    location ~ ^/(api|admin)/ {
        limit_req zone=api burst=60 nodelay;

        proxy_pass http://myproject_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: that appends the real
        # address to whatever the client sent, and a rotated header then gave
        # DRF a new throttle key every request. This overwrites it.
        proxy_set_header X-Forwarded-For $remote_addr;
        # What SECURE_PROXY_SSL_HEADER reads; without it SECURE_SSL_REDIRECT
        # loops forever.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- the single-page front end, if there is one ----------------------

    # `try_files $uri` tests for a file, and `/` is a directory.
    location = / {
        include snippets/myproject-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # A real file is served as is (favicons, robots.txt); anything else is a
    # front-end route and gets index.html. `no-cache` means revalidate, so a
    # deploy never leaves a visitor on the previous build's HTML.
    location / {
        include snippets/myproject-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
