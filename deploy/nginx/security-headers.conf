# Headers for every response Nginx serves itself: the page, the assets, the
# uploads. Django adds the same ones to what it answers, so the proxied
# locations leave this out. `always` covers error responses too.
#
# Installed as /etc/nginx/snippets/myproject-security-headers.conf and
# included per location, because an add_header inside a location discards
# every add_header set at the server level.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;

# Nothing here uses a camera, a microphone or a location, so a script that
# slipped in cannot ask on the site's behalf.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Puts the page in its own browsing-context group, so a window it opens
# cannot reach into it — the Spectre-class cross-window leaks.
add_header Cross-Origin-Opener-Policy same-origin always;

# Content-Security-Policy, report-only to begin with. It matters here because
# the JWT lives where JavaScript can read it, so one XSS is one stolen
# account.
#
# Report-Only enforces nothing, it only logs what would have been blocked, so
# it cannot break a working front end. Watch the browser console for a few
# days, widen the policy until the reports stop, then drop `-Report-Only`.
# An API-only deployment can enforce `default-src 'none'` immediately.
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
